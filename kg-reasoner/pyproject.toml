[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-reasoner-rl-training"
version = "0.1.0"
description = "KG-Reasoner-RL training: reinforcement learning for agentic knowledge graph reasoning"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["kg_reasoner*"]
